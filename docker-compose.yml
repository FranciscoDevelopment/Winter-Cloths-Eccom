services:
  db:
    image: postgres:16
    container_name: clothes_eccom_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${THE_DATABASE_USER}
      POSTGRES_PASSWORD: ${THE_DATABASE_PASS}
      POSTGRES_DB: ${THE_DATABASE_NAME}

    ports:
      - "${DB_PORT}:5432"
    
    volumes:
      - pgdata:/var/lib/postgresql/data


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: clothes_eccom_appi
    restart: unless-stopped

    environment:
      SERVER_PORT: ${API_PORT}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${THE_DATABASE_USER}
      DATABASE_PASS: ${THE_DATABASE_PASS}
      DATABASE_NAME: ${THE_DATABASE_NAME}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

    ports:
      - "${API_PORT}:${API_PORT}"

    depends_on:
      - db


